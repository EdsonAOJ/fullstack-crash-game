name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Generate Games Prisma client
        working-directory: services/games
        run: bun run prisma:generate

      - name: Games typecheck
        working-directory: services/games
        run: bun run typecheck

      - name: Games lint
        working-directory: services/games
        run: bun run lint

      - name: Games unit tests
        working-directory: services/games
        run: bun test tests/unit

      - name: Generate Wallets Prisma client
        working-directory: services/wallets
        run: bun run prisma:generate

      - name: Wallets typecheck
        working-directory: services/wallets
        run: bun run typecheck

      - name: Wallets lint
        working-directory: services/wallets
        run: bun run lint

      - name: Wallets unit tests
        working-directory: services/wallets
        run: bun test tests/unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Start Docker stack
        run: bun run docker:up

      - name: Wait for Games health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/games/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Wait for Wallets health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/wallets/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Games E2E tests
        working-directory: services/games
        run: bun test tests:e2e

      - name: Wallets E2E tests
        working-directory: services/wallets
        run: bun test tests:e2e

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker stack
        if: always()
        run: bun run docker:down
