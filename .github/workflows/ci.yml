name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Games Prisma client
        run: bun run prisma:generate:games

      - name: Games typecheck
        working-directory: services/games
        run: bun run typecheck

      - name: Games lint
        working-directory: services/games
        run: bun run lint

      - name: Games unit tests
        working-directory: services/games
        run: bun test tests/unit

      - name: Generate Wallets Prisma client
        run: bun run prisma:generate:wallets

      - name: Wallets typecheck
        working-directory: services/wallets
        run: bun run typecheck

      - name: Wallets lint
        working-directory: services/wallets
        run: bun run lint

      - name: Wallets unit tests
        working-directory: services/wallets
        run: bun test tests/unit

      - name: Frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Frontend build
        working-directory: frontend
        run: bun run build

  e2e:
    name: Docker E2E tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Docker stack
        run: bun run docker:up

      - name: Show Docker services
        run: docker compose ps

      - name: Wait for Games health
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8000/games/health; then
              echo "Games is healthy"
              exit 0
            fi

            echo "Waiting for Games health... attempt $i"
            sleep 2
          done

          docker compose ps
          docker compose logs games
          docker compose logs kong
          exit 1

      - name: Wait for Wallets health
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8000/wallets/health; then
              echo "Wallets is healthy"
              exit 0
            fi

            echo "Waiting for Wallets health... attempt $i"
            sleep 2
          done

          docker compose ps
          docker compose logs wallets
          docker compose logs kong
          exit 1

      - name: Generate Games Prisma client
        run: bun run prisma:generate:games

      - name: Run Games E2E
        working-directory: services/games
        run: bun run test:e2e

      - name: Generate Wallets Prisma client
        run: bun run prisma:generate:wallets

      - name: Run Wallets E2E
        working-directory: services/wallets
        run: bun run test:e2e

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop Docker stack
        if: always()
        run: bun run docker:down
